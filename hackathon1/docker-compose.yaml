name: myapp

services:

  # ==========================================================
  # WEB APPLICATION BACKEND
  # Node.js + Express.js + Prisma
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}

      DATABASE_URL: postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    networks:
      - app_network
      - db_read_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ==========================================================
  # DATA SERVICE
  # Python + SQLAlchemy + psycopg
  # ==========================================================

  data_service:
    # Not dockerized yet (empty Dockerfile, needs Camoufox + Ollama).
    # Excluded from a plain `docker compose up`; run it explicitly once
    # it's ready with: docker compose --profile scraper up
    profiles: ["scraper"]

    build:
      context: ./data_service
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: "1"
      DATA_SERVICE_DATABASE_URL: postgresql+psycopg://${DATA_SERVICE_DB_USER}:${DATA_SERVICE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - data_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=128m,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.exit(0)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Read by database/init/01-create-app-roles.sh to provision the
      # least-privilege roles backend/data_service connect as.
      BACKEND_DB_USER: ${BACKEND_DB_USER}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD}
      DATA_SERVICE_DB_USER: ${DATA_SERVICE_DB_USER}
      DATA_SERVICE_DB_PASSWORD: ${DATA_SERVICE_DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    networks:
      - db_read_network
      - data_network

    expose:
      - "5432"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s

    shm_size: 256mb

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M


  # ==========================================================
  # FRONTEND
  # React + Vite, served by Nginx
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Left empty so the app calls its own origin, which nginx.conf then
        # proxies to the backend container. Only set this if the backend
        # is hosted on a different origin than the frontend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}

    restart: unless-stopped
    init: true

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app_network


    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/cache/nginx:size=32m
      - /var/run:size=8m

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


# ============================================================
# NETWORKS
# ============================================================

networks:

  app_network:
    driver: bridge

  # Backend can reach PostgreSQL.
  # Data service is NOT attached to this network.
  db_read_network:
    driver: bridge
    internal: true

  # Data service can reach PostgreSQL.
  # Backend is NOT attached to this network.
  data_network:
    driver: bridge
    internal: true


# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data:
    driver: local