name: myapp

services:

  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}

      DATABASE_URL: postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    networks:
      - app_network
      - db_read_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ==========================================================
  # DATA SERVICE
  # ==========================================================

  data_service:
    build:
      context: ./data_service
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped
    init: true

    env_file:
      - ./data_service/.env

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    depends_on:
      postgres:
        condition: service_healthy

      ollama:
        condition: service_started

    networks:
      - data_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=256m,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.exit(0)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    networks:
      - db_read_network
      - data_network

    expose:
      - "5432"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s

    shm_size: 256mb

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M


  # ==========================================================
  # OLLAMA
  # ==========================================================

  ollama:
    image: ollama/ollama:latest

    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - data_network

    expose:
      - "11434"

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G


  # ==========================================================
  # FRONTEND
  # ==========================================================

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     target: production
  #
  #   restart: unless-stopped
  #
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #
  #   networks:
  #     - app_network
  #
  #   expose:
  #     - "80"


# ============================================================
# NETWORKS
# ============================================================

networks:

  app_network:
    driver: bridge

  db_read_network:
    driver: bridge
    internal: true

  data_network:
    driver: bridge
    internal: true


# ============================================================
# VOLUMES
# ============================================================

volumes:

  postgres_data:
    driver: local

  ollama_data:
    driver: local